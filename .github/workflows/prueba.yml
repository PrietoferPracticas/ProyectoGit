name: Comprobacion de Tokens Local vs Secret

on:
  push:

jobs:
  comparar-tokens:
    runs-on: self-hosted

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Comparar DEV_TOKEN de GitHub con LOCAL_DEV_TOKEN
        env:
          DEV_TOKEN_SECRET: ${{ secrets.DEV_TOKEN }}
        shell: powershell
        run: |
          Write-Host "=== Ejecutando tarea en el Self-Hosted Runner (Windows) ==="
          
          # Leemos las variables en PowerShell
          $localVal = $env:LOCAL_DEV_TOKEN
          $secretVal = $env:DEV_TOKEN_SECRET
          
          Write-Host "Comprobando credenciales..."
          
          if ($localVal -and ($localVal -eq $secretVal)) {
              Write-Host " EXITO: El token local coincide exactamente con el Secret guardado en GitHub."
              exit 0
          } else {
              Write-Host " ERROR: El token local ('$localVal') NO coincide con el Secret ('$secretVal')."
              exit 1
          }