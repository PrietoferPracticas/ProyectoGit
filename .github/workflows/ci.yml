name: Pipeline CI (Develop)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Añadir linea de feature al README
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "Añadida feature: $BRANCH_NAME" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: actualizar README con nueva feature" || echo "Sin cambios"
          git push || echo "No push needed"

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Validar DEV_TOKEN
        env:
          DEV_TOKEN_SECRET: ${{ secrets.DEV_TOKEN }}
        shell: powershell
        run: |
          Write-Host "=== Validando DEV_TOKEN en Self-Hosted ==="
          $localVal = $env:LOCAL_DEV_TOKEN
          $secretVal = $env:DEV_TOKEN_SECRET

          if ($localVal -and ($localVal -eq $secretVal)) {
              Write-Host " EXITO: DEV_TOKEN coincide correctamente."
              exit 0
          } else {
              Write-Host " ERROR: DEV_TOKEN no coincide ($localVal vs $secretVal)."
              exit 1
          }
